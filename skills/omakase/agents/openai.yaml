interface:
  display_name: "Omakase"
  short_description: "Scope and guide project work from exploration to delivery"
  default_prompt: "Apply my personal engineering workflow to this project task. Establish a compact scope and select investigation, prototype, bug fix, feature, refactor, performance, or read-only review. Use project tool preferences and workflow-specific evidence. Deliver findings or decision evidence for exploration; use isolated implementation, validation, independent review, publication, and follow-up for authorized production changes. Learn from explicit corrections and verified discoveries at their stated scope."
